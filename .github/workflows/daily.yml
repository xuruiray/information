name: Daily Newspaper

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile to generate"
        required: true
        default: "ai-tech"
      preview:
        description: "Generate a downloadable preview without committing pages"
        type: boolean
        default: false
      edition_date:
        description: "Optional edition date (YYYY-MM-DD)"
        required: false
        default: ""
      source_snapshot:
        description: "Optional committed RSS snapshot path (preview only)"
        required: false
        default: ""

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests
        run: pytest -q
      - name: Validate config
        run: python -m information_daily validate-config --profile "${PROFILE}"
        env:
          PROFILE: ${{ github.event.inputs.profile || 'ai-tech' }}
      - name: Generate newspaper
        run: |
          GENERATE_ARGS=(--profile "$PROFILE" --out docs)
          if [ "$PREVIEW" = "true" ]; then
            mkdir -p preview
            cp -R docs preview/site
            GENERATE_ARGS=(--profile "$PROFILE" --out preview/site --issue-json preview/site/edition.json --editorial-audit preview/site/editorial-audit.json)
          fi
          if [ -n "$SOURCE_SNAPSHOT" ]; then
            if [ "$PREVIEW" != "true" ]; then
              echo 'Saved source snapshots are only allowed in preview runs'
              exit 1
            fi
            GENERATE_ARGS+=(--source-snapshot "$SOURCE_SNAPSHOT")
          fi
          if [ -n "$EDITION_DATE" ]; then
            GENERATE_ARGS+=(--date "$EDITION_DATE")
          fi
          python -m information_daily generate "${GENERATE_ARGS[@]}"
          if [ "$PREVIEW" = "true" ]; then
            python -c 'import json, shutil; from pathlib import Path; date = json.loads(Path("preview/site/edition.json").read_text())["date"]; shutil.copyfile(f"data/raw/{date}.json", "preview/site/raw-snapshot.json")'
          fi
        env:
          PROFILE: ${{ github.event.inputs.profile || 'ai-tech' }}
          PREVIEW: ${{ github.event.inputs.preview || 'false' }}
          EDITION_DATE: ${{ github.event.inputs.edition_date }}
          SOURCE_SNAPSHOT: ${{ github.event.inputs.source_snapshot }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      - name: Commit generated pages
        if: ${{ github.event.inputs.preview != 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: publish daily newspaper"
          file_pattern: "docs data"
      - name: Upload preview
        if: ${{ always() && github.event.inputs.preview == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-preview-${{ github.run_id }}
          path: preview/site
          if-no-files-found: error
